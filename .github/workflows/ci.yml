name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mobile_shop_test_test
          MYSQL_USER: app
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: mobile-shop

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype, iconv, mysql, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('mobile-shop/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uapp -ptestpass && break
            sleep 2
          done

      - name: Run migrations
        env:
          DATABASE_URL: mysql://app:testpass@127.0.0.1:3306/mobile_shop_test?serverVersion=8.0&charset=utf8mb4
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Load fixtures
        env:
          DATABASE_URL: mysql://app:testpass@127.0.0.1:3306/mobile_shop_test?serverVersion=8.0&charset=utf8mb4
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test

      - name: Run tests
        env:
          DATABASE_URL: mysql://app:testpass@127.0.0.1:3306/mobile_shop_test?serverVersion=8.0&charset=utf8mb4
        run: php bin/phpunit
