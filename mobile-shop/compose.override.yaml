services:
  php:
    volumes:
      - ./public:/var/www/html:cached
      # Для Xdebug в режиме разработки раскомментируйте следующую строку:
      # - ./xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    environment:
      APP_ENV: dev
      APP_DEBUG: 1

  nginx:
    volumes:
      - ./public:/var/www/html:cached

  database:
    ports:
      - "3308:3306"

  # Redis для кеширования (опционально)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # Adminer для управления БД (опционально)
  adminer:
    image: adminer:4-standalone
    ports:
      - "8085:8080"
    depends_on:
      database:
        condition: service_healthy
