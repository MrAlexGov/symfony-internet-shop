<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="300" height="300" fill="url(#grad1)"/>

  <!-- Иконка телефона -->
  <g transform="translate(150, 150)">
    <!-- Телефон -->
    <rect x="-50" y="-80" width="100" height="160" rx="15" ry="15" fill="#dee2e6" stroke="#adb5bd" stroke-width="2"/>

    <!-- Экран -->
    <rect x="-40" y="-70" width="80" height="120" rx="10" ry="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/>

    <!-- Кнопка Home -->
    <circle cx="0" cy="55" r="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>

    <!-- Динамик -->
    <rect x="-25" y="-95" width="50" height="4" rx="2" fill="#adb5bd"/>

    <!-- Камера -->
    <circle cx="25" cy="-95" r="6" fill="#495057"/>

    <!-- Датчик -->
    <circle cx="10" cy="-95" r="2" fill="#495057"/>

    <!-- Кнопки -->
    <rect x="-45" y="-40" width="6" height="20" rx="3" fill="#adb5bd"/>
    <rect x="-45" y="20" width="6" height="20" rx="3" fill="#adb5bd"/>
    <rect x="-45" y="-10" width="6" height="20" rx="3" fill="#adb5bd"/>
  </g>

  <!-- Декоративные элементы -->
  <circle cx="50" cy="50" r="20" fill="#e9ecef" opacity="0.5"/>
  <circle cx="250" cy="250" r="30" fill="#e9ecef" opacity="0.5"/>
  <circle cx="250" cy="50" r="15" fill="#e9ecef" opacity="0.5"/>
</svg>